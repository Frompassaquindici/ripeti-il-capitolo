<style>
/* Layout: una colonna da telefono, vetro chiaro su sfondo sfumato, barra di tab fluttuante */
:root{
  --bg1:#F5F7F6;--bg2:#EAF0EE;--bg3:#E5EAF3;
  --blob1:#BFE3D5;--blob2:#D3DDF8;--blob3:#F6E4D3;--blob-o:.75;

  --accent:#1F6F5C;--accent-soft:rgba(31,111,92,.12);--on-accent:#fff;
  --sand:rgba(250,232,214,.78);--sand-fg:#8A4B14;
  --good:#1F6F5C;--warn:#9A5518;--bad:#A3392F;
  --orb:radial-gradient(circle at 32% 26%,#7FD0B5 0%,#2E8B73 48%,#1F6F5C 100%);
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#0E1614;--bg2:#101A18;--bg3:#111722;
  --blob1:#1D5A49;--blob2:#27366B;--blob3:#5A3A1E;--blob-o:.45;
  --glass:rgba(30,44,41,.62);--glass-b:rgba(255,255,255,.09);--shadow:0 8px 32px rgba(0,0,0,.35);
  --fg:#E8EEEC;--fg2:#9AA6A2;--line:rgba(255,255,255,.1);
  --accent:#5FC4A5;--accent-soft:rgba(95,196,165,.16);--on-accent:#0E1614;
  --sand:rgba(110,72,36,.35);--sand-fg:#F0C9A0;
  --good:#5FC4A5;--warn:#E3A765;--bad:#F08A80;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#0E1614;--bg2:#101A18;--bg3:#111722;
  --blob1:#1D5A49;--blob2:#27366B;--blob3:#5A3A1E;--blob-o:.45;
  --glass:rgba(30,44,41,.62);--glass-b:rgba(255,255,255,.09);--shadow:0 8px 32px rgba(0,0,0,.35);
  --fg:#E8EEEC;--fg2:#9AA6A2;--line:rgba(255,255,255,.1);
  --accent:#5FC4A5;--accent-soft:rgba(95,196,165,.16);--on-accent:#0E1614;
  --sand:rgba(110,72,36,.35);--sand-fg:#F0C9A0;
  --good:#5FC4A5;--warn:#E3A765;--bad:#F08A80;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--fg);background:linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;min-height:100vh;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-o)}
.blobs i:nth-child(1){width:340px;height:340px;background:var(--blob1);top:-110px;right:-120px}
.blobs i:nth-child(2){width:300px;height:300px;background:var(--blob2);bottom:40px;left:-130px}
.blobs i:nth-child(3){width:220px;height:220px;background:var(--blob3);top:45%;right:-80px}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(130px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.03em}
h2{margin:0;font-size:13px;font-weight:500;color:var(--fg2);letter-spacing:.02em}
.sub{color:var(--fg2);font-size:15px;margin-top:2px}
.sub.nocap{text-transform:none}
.card{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:24px;padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;padding-top:8px;margin-bottom:18px;gap:12px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--fg2)}
.pill{min-height:48px;padding:0 22px;border-radius:26px;border:none;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:500}

.sand .link,.sand .pill.ghost{color:var(--sand-fg)}
.muted{color:var(--fg2);font-size:13px}

.err:empty{display:none}
/* orb */
.orbwrap{display:flex;flex-direction:column;align-items:center;margin:26px 0 22px}

/* forms */
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:14px 16px;resize:vertical}

.mic.on{animation:pulse 1.6s ease-in-out infinite;box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 18%,transparent),0 18px 36px rgba(31,111,92,.3)}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;margin:18px 0}
/* lists */
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--glass-b);background:var(--glass);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.item b{font-weight:600;font-size:16px;display:block}
.sec{margin-top:6px}
.sec h2{margin:0 0 8px 4px}

.quote{border-left:3px solid var(--accent);padding-left:12px;font-style:italic}

.v-ok{background:var(--accent-soft);color:var(--good)}

.v-manca{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{min-height:52px;border-radius:18px;border:1px solid var(--glass-b);background:var(--glass);font-size:14px;font-weight:500;padding:6px}
.progress{display:flex;gap:6px;margin:0 4px 16px}
.progress i{flex:1;height:4px;border-radius:2px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.progress i.d{background:var(--accent)}
.bigq{font-size:25px;line-height:1.2;font-weight:600;letter-spacing:-.025em}
/* focus */
.seg{display:flex;gap:4px;padding:4px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-b)}
.seg button{flex:1;min-height:42px;border:none;border-radius:22px;background:none;color:var(--fg2);font-size:14px;font-weight:500}
.seg button.on{background:var(--bg1);color:var(--fg);box-shadow:0 2px 8px rgba(40,70,80,.12)}
.timer{position:relative;width:268px;height:268px;margin:22px auto 8px;max-width:100%}
.timer svg{position:absolute;inset:0;width:100%;height:100%}
.timer .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.timer .t b{font-size:70px;font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:10px}
.round{width:56px;height:56px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);display:flex;align-items:center;justify-content:center}
.round.main{width:80px;height:80px;border:none;background:var(--orb);color:#fff;box-shadow:0 16px 32px rgba(31,111,92,.3)}
/* tabs */
.tabs{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));height:68px;padding:6px;border-radius:34px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:0 10px 36px rgba(40,70,80,.14);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);display:flex;gap:4px}
.tabs[hidden]{display:none}
.tabs button{flex:1;border:none;border-radius:28px;background:none;color:var(--fg2);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs button.on{background:var(--bg1);color:var(--accent);box-shadow:0 2px 8px rgba(40,70,80,.12)}
.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg1);border-radius:20px;padding:10px 18px;font-size:14px;font-weight:500}
.toast[hidden]{display:none}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orb.on,.mic.on,.spin{animation:none}}

/* rifiniture UI v5 */
textarea,input[type=text],input[type=password],input[type=time]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--glass);border:1px solid var(--glass-b);border-radius:18px;padding:13px 16px;min-height:48px;-webkit-appearance:none;appearance:none}
textarea{resize:none}
input::placeholder,textarea::placeholder{color:var(--fg2);opacity:.75}
.tabs{background:color-mix(in srgb,var(--bg1) 88%,transparent)}
.seg button{white-space:nowrap}
.link{min-height:44px}
label.link{padding-left:0;padding-right:0}
</style>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=864e5, INT=[1,3,7,16,35,90];
const IC={
 mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>',
 book:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>',
 timer:'<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 1.5"/><path d="M9.5 3h5"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',
 x:'<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
 stop:'<rect x="6" y="6" width="12" height="12" rx="2.5"/>',
 reset:'<path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4.5h4.5"/>',
 skip:'<path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/>',
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
const ic=(n,s=22,w=1.6,f="none")=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const icFill=(n,s)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor">${n==='pause'?'<rect x="6" y="5" width="4.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.6"/>':'<path d="M7 4.5v15l12-7.5z"/>'}</svg>`;

/* ---------- stato ---------- */
const S={view:"home",tab:"home",chapters:[],loaded:false,loadNote:"",draft:"",partial:"",listening:false,micErr:"",
 pending:null,err:"",rev:null,openId:null,confirmDel:false,banner:false,ctl:null};
S.ask={q:"",a:"",busy:false,err:""};
const F={mode:"25",presets:{"25":[25,5],"50":[50,10],"90":[90,15]},phase:"work",total:1500,rem:1500,running:false,endAt:0,sessions:0};
let dict=null;S.trans=false;

/* ---------- capitoli di partenza: si aggiungono una volta sola ---------- */
const SEED=window.SEED||[];
/* ---------- archivio: solo su questo telefono ---------- */
const Store={
 init(){try{S.chapters=JSON.parse(localStorage.getItem("rc_chapters")||"[]")}catch(e){S.chapters=[]}S.loaded=true;this._seed()},
 _seed(){try{let done=[];try{done=JSON.parse(localStorage.getItem("rc_seeded")||"[]")}catch(e){}let ch=false;const now=Date.now();
  SEED.forEach(s=>{if(done.includes(s.id))return;done.push(s.id);ch=true;if(S.chapters.find(x=>x.id===s.id))return;
   S.chapters.push(Object.assign({},s,{createdAt:now,questions:s.questions.map((x,k)=>({id:"q"+k,q:x.q,ideal:x.ideal,step:0,due:now+INT[0]*DAY,last:0,tries:0}))}))});
  if(ch){S.chapters.sort((a,b)=>b.createdAt-a.createdAt);this._persist();localStorage.setItem("rc_seeded",JSON.stringify(done))}}catch(e){}},
 _persist(){try{localStorage.setItem("rc_chapters",JSON.stringify(S.chapters))}catch(e){toast("Memoria piena: esporta una copia")}},
 async put(c){S.chapters=[c,...S.chapters.filter(x=>x.id!==c.id)].sort((a,b)=>b.createdAt-a.createdAt);this._persist()},
 async patch(id,p){const c=S.chapters.find(x=>x.id===id);if(c)Object.assign(c,p);this._persist()},
 async remove(id){S.chapters=S.chapters.filter(x=>x.id!==id);this._persist()}};

/* ---------- AI: chiamata diretta all'API Anthropic con la chiave salvata sul telefono ---------- */
const MODEL_MAIN="claude-sonnet-5-5",MODEL_FAST="claude-haiku-5-5";
function getKey(){try{return localStorage.getItem("rc_key")||""}catch(e){return ""}}
async function askRaw(prompt,opt){
 opt=opt||{};const key=getKey();if(!key)throw{code:"no_key"};
 const content=opt.image?[{type:"image",source:{type:"base64",media_type:opt.image.type,data:opt.image.data}},{type:"text",text:prompt}]:prompt;
 let r;
 try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opt.signal,
  headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
  body:JSON.stringify({model:opt.model||MODEL_MAIN,max_tokens:8000,messages:[{role:"user",content}]})})}
 catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:"network"}}
 if(r.status===401||r.status===403)throw{code:"auth"};
 if(r.status===429)throw{code:"rate_limited"};
 if(!r.ok){let m="";try{m=JSON.stringify(await r.json())}catch(e){}throw{code:/credit/i.test(m)?"credit":"upstream_error"}}
 const j=await r.json();return (j.content||[]).map(b=>b.text||"").join("");
}
async function askText(p,o){return (await askRaw(p,o)).trim()}
async function askJSON(p,o){
 const text=await askRaw(p,o);const i=text.indexOf("{"),k=text.lastIndexOf("}");
 try{return JSON.parse(text.slice(i,k+1))}catch(e){throw{code:"invalid_json"}}
}

/* ---------- misure dell'alpha: registro eventi sul telefono ---------- */
function getLog(){try{return JSON.parse(localStorage.getItem("rc_log")||"[]")}catch(e){return[]}}
function logEv(t,x){try{const a=getLog();a.push(Object.assign({t,at:Date.now()},x||{}));localStorage.setItem("rc_log",JSON.stringify(a.slice(-800)))}catch(e){}}

/* ---------- registratore audio + trascrizione (OpenAI) ---------- */
function getOKey(){try{return localStorage.getItem("rc_okey")||""}catch(e){return ""}}
async function transcribe(blob,type){
 const ext=type.includes("mp4")?"m4a":type.includes("ogg")?"ogg":"webm";
 const fd=new FormData();fd.append("file",blob,"audio."+ext);fd.append("model","gpt-4o-mini-transcribe");fd.append("language","it");
 let r;try{r=await fetch("https://api.openai.com/v1/audio/transcriptions",{method:"POST",headers:{Authorization:"Bearer "+getOKey()},body:fd})}catch(e){throw{code:"network"}}
 if(r.status===401)throw{code:"auth_o"};
 if(r.status===429)throw{code:"credit_o"};
 if(!r.ok)throw{code:"upstream_error"};
 const j=await r.json();return j.text||"";
}
function makeDict(){
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder))return null;
 let rec=null,stream=null,chunks=[],want=false,busy=false,H={},waiters=[];
 const emit=(k,v)=>{try{H[k]&&H[k](v)}catch(e){}};
 const pick=()=>{for(const m of ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"]){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return ""};
 const release=()=>{busy=false;const w=waiters;waiters=[];w.forEach(f=>f())};
 return {
  active:()=>want||busy,
  start(){return new Promise((res,rej)=>{
   if(!getOKey()){rej({code:"no_okey"});return}
   want=true;
   navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
    stream=s;chunks=[];const mime=pick();
    rec=mime?new MediaRecorder(s,{mimeType:mime}):new MediaRecorder(s);
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=async()=>{
     try{stream.getTracks().forEach(t=>t.stop())}catch(e){}
     const type=rec.mimeType||mime||"audio/mp4";const blob=new Blob(chunks,{type});chunks=[];
     want=false;busy=true;
     if(blob.size<3000){emit("state",{state:"idle",reason:"empty"});release();return}
     emit("state",{state:"transcribing"});
     try{const t=await transcribe(blob,type);if(t.trim())emit("final",{text:" "+t.trim()});emit("state",{state:"idle",reason:t.trim()?undefined:"empty"})}
     catch(e){emit("state",{state:"idle",reason:(e&&e.code)||"upstream_error"})}
     release();
    };
    rec.start();res();emit("state",{state:"listening"});
   }).catch(e=>{want=false;rej({code:(e&&(e.name==="NotAllowedError"||e.name==="SecurityError"))?"not_granted":"upstream_error"})});
  })},
  stop(){
   if(want&&rec){return new Promise(r=>{waiters.push(r);try{rec.stop()}catch(e){want=false;release()}})}
   if(busy)return new Promise(r=>waiters.push(r));
   return Promise.resolve();
  },
  onFinal:f=>{H.final=f},onPartial:f=>{H.partial=f},onState:f=>{H.state=f}
 };
}

function micMsg(c){return {not_granted:"Microfono non consentito. Abilitalo per questo sito nelle impostazioni del browser.",
 no_okey:"Manca la chiave di trascrizione. Aggiungila nelle impostazioni (ingranaggio in alto).",
 auth_o:"La chiave di trascrizione non è valida. Controllala nelle impostazioni.",
 credit_o:"Credito OpenAI finito o troppe richieste. Controlla il tuo account OpenAI.",
 network:"Nessuna connessione. Riprova quando sei online.",
 empty:"Non ho sentito niente. Riprova più vicino al microfono."}[c]||"Registrazione non riuscita. Riprova o scrivi nel riquadro."}
/* ---------- calcoli ---------- */
function allQ(){const a=[];S.chapters.forEach(c=>(c.questions||[]).forEach(q=>a.push({c,q})));return a}
function dueList(){const n=Date.now();return allQ().filter(x=>x.q.due<=n).sort((a,b)=>a.q.due-b.q.due)}
function streak(){
 const days=new Set();const k=t=>{const d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()};
 S.chapters.forEach(c=>{days.add(k(c.createdAt));(c.questions||[]).forEach(q=>{if(q.last)days.add(k(q.last))})});
 let n=0,t=Date.now();if(!days.has(k(t)))t-=DAY;
 while(days.has(k(t))){n++;t-=DAY}return n}
function bookList(){const m=new Map();S.chapters.forEach(c=>{const key=(c.book||"").toLowerCase();if(!m.has(key))m.set(key,{book:c.book,author:c.author,chapters:[]});m.get(key).chapters.push(c)});return[...m.values()]}
const fmtDay=t=>new Date(t).toLocaleDateString("it-IT",{day:"numeric",month:"short"});

 S.view=v;if(TABVIEW[v])S.tab=TABVIEW[v];S.err="";render();if(!(opts&&opts.keepScroll))window.scrollTo(0,0)}
function softRender(){if(["home","library","focus","chapter"].includes(S.view))render()}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true},2600)}
function setErr(t){const e=$("#err");if(e)e.textContent=t||""}

V.confirm=()=>{
 const p=S.pending,known=bookList(),n=p.items.length;
 const sec=(t,arr,fn)=>arr&&arr.length?`<div class="sec"><h2>${t}</h2><div class="stack" style="gap:8px">${arr.map(fn).join("")}</div></div>`:"";
 const one=(ai,i)=>{
  const conf=typeof ai.confidence==="number"?Math.round(ai.confidence*100):null;
  const alts=(ai.alternatives||[]).filter(Boolean);
  return `<div class="stack" data-item="${i}">
  <div class="card stack" style="gap:12px"><div class="row"><b style="font-size:17px;font-weight:600" class="grow">${n>1?"Capitolo "+(i+1)+" di "+n:(ai.book?"È questo il libro?":"Di che libro parli?")}</b>${conf!==null?`<span class="tag">${conf}% sicuro</span>`:""}${n>1?`<button class="link" data-act="dropitem" data-i="${i}" style="color:var(--bad)">Togli</button>`:""}</div>
   <div><label for="f-book-${i}">Titolo</label><input type="text" id="f-book-${i}" value="${esc(ai.book||"")}" autocomplete="off"></div>
   <div><label for="f-author-${i}">Autore</label><input type="text" id="f-author-${i}" value="${esc(ai.author||"")}" autocomplete="off"></div>
   <div><label for="f-chap-${i}">Capitolo</label><input type="text" id="f-chap-${i}" value="${esc(ai.chapter||"")}" autocomplete="off"></div>
   ${known.length||alts.length?`<div class="chips">${known.map(b=>`<button class="chip" data-act="pick" data-i="${i}" data-book="${esc(b.book)}" data-author="${esc(b.author||"")}">${esc(b.book)}</button>`).join("")}${alts.map(b=>`<button class="chip" data-act="pick" data-i="${i}" data-book="${esc(b)}" data-author="">${esc(b)}</button>`).join("")}</div>`:""}
   ${ai.book&&conf!==null&&conf<80?`<div class="muted">Non sono sicuro: controlla titolo e capitolo.</div>`:""}
  </div>
  <label class="link" style="cursor:pointer;display:inline-flex;align-items:center">Aggiungi foto di una pagina<input type="file" accept="image/*" data-photo="${i}" hidden></label>
  ${ai.summary?`<div class="card">${esc(ai.summary)}</div>`:""}
  ${sec("Concetti",ai.concepts,x=>`<div class="note"><b>${esc(x.title)}</b>${esc(x.text)}</div>`)}
  ${sec("Citazioni",ai.quotes,x=>`<div class="note quote">${esc(x)}</div>`)}
  ${sec("Dati",ai.data,x=>`<div class="note">${esc(x)}</div>`)}
  ${ai.unclear&&ai.unclear.length?`<div class="sec"><h2>Da controllare sul libro</h2><div class="stack" style="gap:8px">${ai.unclear.map(x=>`<div class="note sand">${esc(x)}</div>`).join("")}</div></div>`:""}
  ${ai.questions&&ai.questions.length?`<div class="muted" style="margin:0 4px">${ai.questions.length} domande pronte per il ripasso, la prima domani.</div>`:""}
  </div>`};

 ${p.items.map(one).join("")}
 <div class="muted" style="margin:0 4px">L'AI lavora solo su ciò che hai detto, non sul testo del libro: se hai sbagliato qualcosa, resta sbagliato.</div>

 if(!R.items.length)return `<div class="top"><button class="iconbtn" data-act="endrev" aria-label="Chiudi">${ic("x",18)}</button><div style="font-weight:500">Ripasso</div><span style="width:44px"></span></div><div class="card"><b style="font-weight:600">Non ci sono domande</b><div class="muted">Registra un capitolo e le domande compaiono qui.</div></div>`;
 if(R.i>=R.items.length)return `<div class="top"><button class="iconbtn" data-act="endrev" aria-label="Chiudi">${ic("x",18)}</button><div style="font-weight:500">Ripasso</div><span style="width:44px"></span></div>

 const {c,q}=R.items[R.i];
 const prog=`<div class="progress">${R.items.map((_,i)=>`<i class="${i<R.i?"d":""}"></i>`).join("")}</div>`;
 const head=`<div class="top"><button class="iconbtn" data-act="endrev" aria-label="Chiudi">${ic("x",18)}</button><div style="font-weight:500">Richiamo attivo</div><div class="muted" style="width:44px;text-align:right">${R.i+1} / ${R.items.length}</div></div>${prog}`;
 const card=`<div class="card stack" style="padding:22px"><span class="tag" style="align-self:flex-start">Spiega con parole tue</span><div class="bigq">${esc(q.q)}</div><div class="muted">${esc(c.book)} · capitolo ${esc(c.chapter||"?")}</div></div>`;
 if(R.stage==="answer")return head+`<div class="stack">${card}
  <textarea id="tx" style="min-height:130px" aria-label="La tua risposta" placeholder="Rispondi senza guardare gli appunti">${esc(S.draft)}</textarea>
  <div class="partial" id="partial">${esc(S.partial)}</div>
  <div class="center" style="margin:6px 0">${dict?`<button class="mic${S.listening?" on":""}" id="micbtn" data-act="mic" aria-label="Rispondi a voce">${ic("mic",38,1.4)}</button><div class="muted" id="mstat">${S.listening?"Sto registrando… tocca per fermare":"Rispondi a voce"}</div>`:""}<div class="muted" id="micerr">${esc(S.micErr)}</div></div>
  <div class="err" id="err"></div>
  <div class="row"><button class="pill grow" data-act="grade">Valuta la risposta</button><button class="link" data-act="reveal">Mostra la risposta</button></div></div>`;
 if(R.stage==="grading")return head+`<div class="stack">${card}<div class="stack" style="text-align:center;gap:12px;margin-top:20px"><div class="spin"></div><div class="muted">Confronto con la tua spiegazione di allora…</div></div></div>`;
 const r=R.res;
 const vlabel={ok:"Risposta solida",parziale:"Quasi",manca:"Manca qualcosa"}[r.verdict];
 return head+`<div class="stack">${card}
  ${r.verdict?`<div class="card stack" style="gap:8px"><span class="verdict v-${r.verdict}" style="align-self:flex-start">${vlabel}</span>${r.feedback?`<div>${esc(r.feedback)}</div>`:""}${r.missing&&r.missing.length?`<div class="muted">Mancava: ${r.missing.map(esc).join(" · ")}</div>`:""}</div>`:""}
  ${r.err?`<div class="muted">${esc(r.err)}</div>`:""}
  <div class="card"><h2 style="margin-bottom:4px">La tua spiegazione di allora</h2>${esc(q.ideal)}</div>
  <div><h2 style="margin:0 4px 8px">Quanto lo ricordavi davvero?</h2><div class="rate"><button data-act="rate" data-r="no">Non lo ricordavo</button><button data-act="rate" data-r="part">A metà</button><button data-act="rate" data-r="ok">Lo sapevo</button></div></div></div>`};

/* Ogni settimana proposte.json può contenere un blocco di 3 paper. Arriva solo se la sua data è passata e tutti i paper dei blocchi precedenti sono chiusi. */
async function loadWeekly(){
 try{const r=await fetch("proposte.json",{cache:"no-store"});if(!r.ok)return;const j=await r.json();
  let got=[];try{got=JSON.parse(localStorage.getItem("rc_batches")||"[]")}catch(e){}
  for(const b of (j.batches||[])){
   if(got.includes(b.id))continue;
   if(b.from&&Date.now()<new Date(b.from).getTime())break;
   if(S.chapters.some(c=>c.batch&&!paperDone(c)))break;
   const now=Date.now();
   (b.papers||[]).slice(0,3).forEach((p,k)=>{if(S.chapters.find(x=>x.id===p.id))return;
    S.chapters.push(Object.assign({},p,{kind:"paper",book:"Paper e articoli",batch:b.id,createdAt:now-k,
     questions:(p.questions||[]).map((x,n)=>({id:"q"+n,q:x.q,ideal:x.ideal,step:0,due:now+INT[0]*DAY,last:0,tries:0}))}))});
   got.push(b.id);S.chapters.sort((a,c)=>c.createdAt-a.createdAt);Store._persist();
   try{localStorage.setItem("rc_batches",JSON.stringify(got))}catch(e){}
   logEv("batch",{id:b.id});if(["home","library"].includes(S.view))render();break}
 }catch(e){}
}

   src=raw;let r;
   try{r=await fetch("https://r.jina.ai/"+raw)}catch(e){throw{code:"link"}}
   if(!r.ok)throw{code:"link"};text=await r.text();if(text.length<500)throw{code:"link"};
  }
  const prompt=`Sei l'assistente di un'app di studio per Luigi, che usa il palazzo della memoria e altre tecniche per ricordare. Sotto c'è il testo di un paper, articolo o capitolo. Trasformalo in una scheda che lo aiuti a capirlo in fretta e a fare suo ciò che serve, senza ripetere l'articolo.

{"title": "titolo chiaro in italiano, massimo 12 parole", "source": "autori, rivista o sito e anno, se il testo li riporta, altrimenti stringa vuota", "summary": "una frase che dice la tesi", "images": [{"title": "nome breve dell'immagine", "text": "la scena"}] (da 5 a 6), "phrases": ["..."] (da 4 a 6), "quotes": ["..."] (da 0 a 2), "deep": [{"title": "...", "text": "..."}] (da 4 a 6), "data": ["..."] (fino a 6), "unclear": ["..."] (da 1 a 4), "questions": [{"q": "...", "ideal": "..."}] (5)}

- phrases: frasi brevi, con carattere, che Luigi può riusare in un video o in una discussione. Parole tue, non copiate dal testo.
- quotes: solo frasi che stanno davvero nel testo, copiate alla lettera, sotto le 15 parole l'una. Se non ce ne sono di buone, lascia la lista vuota.
- deep: i dettagli specifici che completano il quadro dopo le immagini: metodo, numeri, nomi, risultati, limiti. Da 2 a 3 frasi ciascuno.

- questions: richiamo attivo. Alcune chiedono cosa rappresenta una certa immagine, altre di spiegare un'idea con parole proprie. "ideal" è la risposta corretta in una o due frasi.

Testo:
"""
${text.slice(0,60000)}

   data:arr(j.data).map(String).slice(0,6),unclear:arr(j.unclear).map(String).slice(0,4),

async function process(text){
 S.draft=text;S.err="";go("processing");
 let items=null,fail="";
 if(!getKey())fail=errCopy("no_key");
 else{
  S.ctl=new AbortController();
  const known=bookList().map(b=>b.book).join(" | ")||"nessuno";
  const prompt=`Sei l'assistente di un'app di studio. Luigi ha appena letto uno o più capitoli e li ha spiegati a voce in un'unica registrazione. Sotto c'è la trascrizione, che può contenere errori di riconoscimento vocale.
Libri già in libreria: ${known}.
Se nella registrazione parla di più capitoli, o di più libri, dividila in un elemento per capitolo, nell'ordine in cui li ha detti. Ogni elemento contiene solo ciò che riguarda quel capitolo. Se parla di un solo capitolo, restituisci un solo elemento. Non creare più elementi per lo stesso capitolo.
Rispondi SOLO con un oggetto JSON di questa forma:
{"chapters": [ {"book": titolo o null, "author": autore o null, "chapter": numero o titolo del capitolo come stringa, o null, "confidence": numero da 0 a 1 su quanto sei sicuro di libro e capitolo, "alternatives": [fino a 2 titoli alternativi plausibili], "summary": "una frase", "concepts": [{"title": "...", "text": "..."}] (da 3 a 6), "quotes": ["..."] (solo frasi che Luigi ha pronunciato come citazioni), "data": ["..."] (numeri, date, nomi propri citati), "unclear": ["..."] (passaggi vaghi o possibilmente imprecisi, che non si possono controllare senza il libro), "questions": [{"q": "domanda di richiamo attivo, che richiede di spiegare", "ideal": "risposta corretta basata SOLO su ciò che Luigi ha detto"}] (da 3 a 5)} ]}
Regole: non aggiungere informazioni che non sono nella trascrizione. Se libro o capitolo non emergono chiaramente dal testo, usa null e una confidence bassa: non indovinare. Se il libro è lo stesso dell'elemento precedente e non viene ripetuto, usa lo stesso titolo. Scrivi in italiano.

Trascrizione:
"""
${text.slice(0,30000)}
"""`;
  try{
   const j=await askJSON(prompt,{signal:S.ctl.signal,model:MODEL_MAIN});
   const list=Array.isArray(j.chapters)?j.chapters:(j&&typeof j==="object"&&(j.book!==undefined||j.concepts)?[j]:[]);
   items=list.map(normalize).filter(Boolean).slice(0,8);
   if(!items.length){items=null;fail=errCopy("invalid_json")}
  }catch(e){if(e&&e.code==="cancelled"){go("record");return}fail=errCopy(e&&e.code)}
 }
 S.pending={transcript:text,items:items||[normalize({})],fail};
 go("confirm");
}

  try{
   const prompt=`Domanda di ripasso: ${q.q}
Risposta di riferimento (la spiegazione che Luigi aveva dato dopo aver letto, non verificata sul libro): ${q.ideal}
Risposta di Luigi adesso: ${ans}
Rispondi SOLO con JSON: {"verdict": "ok" oppure "parziale" oppure "manca", "feedback": "massimo 2 frasi, tono diretto", "missing": ["punti chiave che mancano, massimo 3"]}
Valuta il significato, non le parole. Non aggiungere informazioni esterne.`;
   const j=await askJSON(prompt,{model:MODEL_FAST});
   const v=["ok","parziale","manca"].includes(j.verdict)?j.verdict:"parziale";
   res={verdict:v,feedback:String(j.feedback||""),missing:arr(j.missing).map(String).slice(0,3)};
  }catch(e){res={verdict:null,err:"Non sono riuscito a valutare. Confronta tu con la risposta qui sotto."}}
 }else res.err="Manca la chiave AI. Confronta tu con la risposta qui sotto.";
 R.res=res;R.stage="result";render();
}
async function rate(r){
 const R=S.rev,{c,q}=R.items[R.i];
 logEv("rate",{r,step:q.step||0});
 let step=q.step||0;
 if(r==="ok")step=Math.min(step+1,INT.length-1);else if(r==="no")step=0;
 const days=r==="part"?Math.max(1,Math.round(INT[step]/2)):INT[step];
 const nq=(c.questions||[]).map(x=>x.id===q.id?Object.assign({},x,{step,due:Date.now()+days*DAY,last:Date.now(),tries:(x.tries||0)+1}):x);
 R.counts[r]++;R.i++;R.stage="answer";R.res=null;S.draft="";S.partial="";
 render();window.scrollTo(0,0);
 try{await Store.patch(c.id,{questions:nq})}catch(e){toast("Non sono riuscito a salvare l'ultimo voto")}
}
async function save(){
 const p=S.pending,docs=[],now=Date.now();
 for(let i=0;i<p.items.length;i++){
  const ai=p.items[i];
  const book=($("#f-book-"+i)||{}).value.trim(),author=($("#f-author-"+i)||{}).value.trim(),chapter=($("#f-chap-"+i)||{}).value.trim();
  const tag=p.items.length>1?"Capitolo "+(i+1)+": ":"";
  if(!book){setErr(tag+"scrivi il titolo del libro.");return}
  if(!chapter){setErr(tag+"scrivi il numero o il titolo del capitolo.");return}
  const id="c"+(now+i).toString(36);
  docs.push({id,book,author,chapter,confidence:ai.confidence==null?0:ai.confidence,transcript:p.transcript,summary:ai.summary||"",
   concepts:ai.concepts||[],quotes:ai.quotes||[],data:ai.data||[],unclear:ai.unclear||[],
   questions:(ai.questions||[]).map((x,k)=>({id:"q"+k,q:x.q,ideal:x.ideal,step:0,due:now+INT[0]*DAY,last:0,tries:0})),createdAt:now+i});
 }
 const b=document.querySelector('[data-act="save"]');if(b)b.disabled=true;
 try{for(const d of docs)await Store.put(d)}catch(e){if(b)b.disabled=false;setErr("Non sono riuscito a salvare. Riprova.");return}
 S.pending=null;S.draft="";S.partial="";
 logEv("saved",{n:docs.length});
 toast(docs.length>1?docs.length+" capitoli salvati":"Capitolo salvato");go("home");
}

/* ---------- timer ---------- */
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=660;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.2,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.22);o.start(a.currentTime+t);o.stop(a.currentTime+t+.25)})}catch(e){}}
function endPhase(){
 F.running=false;beep();
 if(F.phase==="work"){F.sessions++;F.phase="break";F.total=F.presets[F.mode][1]*60;S.banner=true}
 else{F.phase="work";F.total=F.presets[F.mode][0]*60}
 F.rem=F.total;if(S.view==="focus"||S.view==="home")render();
}
setInterval(()=>{if(!F.running)return;F.rem=Math.max(0,Math.round((F.endAt-Date.now())/1000));paintF();if(F.rem<=0)endPhase()},500);

/* ---------- eventi ---------- */
document.addEventListener("click",ev=>{
 const el=ev.target.closest("[data-act]");if(!el)return;
 const a=el.dataset.act;
 if(a==="mic"){ // deve partire subito dal clic
  if(!dict)return;
  if(dict.active()){dict.stop().catch(()=>{});return}
  S.micErr="";dict.start().catch(e=>{S.micErr=micMsg(e&&e.code);paintRec()});
  return}
 switch(a){
  case "tab":if(el.dataset.v==="ask")S.draft=S.ask.q||"";go(el.dataset.v);break;
  case "settings":go("settings");break;
  case "paper":S.draft="";S.partial="";S.micErr="";S.paper={busy:false,err:""};go("paper");break;
  case "papergo":paperGo();break;
  case "imgedit":{const c=S.chapters.find(x=>x.id===el.dataset.id),i=+el.dataset.i;S.editImg={id:el.dataset.id,i};S.draft=(c&&c.images&&c.images[i]&&c.images[i].mine)||"";S.partial="";S.micErr="";render();break}
  case "imgcancel":if(dict&&dict.active())dict.stop().catch(()=>{});S.editImg=null;S.draft="";S.partial="";render();break;
  case "imgsave":{if(dict&&dict.active())dict.stop().catch(()=>{});const e=S.editImg,c=e&&S.chapters.find(x=>x.id===e.id);if(!c)break;const v=(($("#tx")||{}).value||"").trim();
   const im=(c.images||[]).map((x,k)=>k===e.i?Object.assign({},x,{mine:v}):x);S.editImg=null;S.draft="";S.partial="";
   Store.patch(c.id,{images:im}).then(()=>{toast(v?"Salvata":"Torna la proposta");render()});break}
  case "stats":go("stats");break;
  case "skipped":logEv("skipped");toast("Segnato");render();break;
  case "askgo":askLibrary();break;
  case "reminder":addReminder();break;
  case "savekey":{const k=el.dataset.k,v=(($("#k-"+k)||{}).value||"").trim(),e=$("#err-"+k);
   const ok=k==="a"?/^sk-ant-/.test(v)&&v.length>30:/^sk-/.test(v)&&!/^sk-ant-/.test(v)&&v.length>30;
   if(!ok){if(e)e.textContent=k==="a"?"Non sembra una chiave Anthropic: deve iniziare con sk-ant- ed essere lunga.":"Non sembra una chiave OpenAI: deve iniziare con sk- ed essere lunga.";break}
   try{localStorage.setItem(k==="a"?"rc_key":"rc_okey",v)}catch(x){if(e)e.textContent="Non riesco a salvarla su questo browser.";break}
   toast("Chiave salvata");render();break}
  case "clearkey":try{localStorage.removeItem(el.dataset.k==="a"?"rc_key":"rc_okey")}catch(x){}toast("Chiave rimossa");render();break;
  case "skipkey":try{localStorage.setItem("rc_skip","1")}catch(e){}go("home");break;
  case "export":exportData();break;
  case "rec":S.draft="";S.partial="";S.micErr="";go("record");break;
  case "cancelrec":if(dict&&dict.active())dict.stop().catch(()=>{});S.draft=($("#tx")||{}).value||S.draft;go("home");break;
  case "process":{
   (async()=>{if(dict&&dict.active())await dict.stop().catch(()=>{});
    const t=(($("#tx")||{}).value||"").trim();
    if(t.length<40){setErr("Racconta qualche frase in più: servono più parole per riconoscere libro e capitolo.");return}
    process(t)})();break}
  case "stopproc":if(S.ctl)S.ctl.abort();break;
  case "backrec":go("record");break;
  case "retry":process(S.pending.transcript);break;
  case "pick":{const i=el.dataset.i;$("#f-book-"+i).value=el.dataset.book;if(el.dataset.author)$("#f-author-"+i).value=el.dataset.author;break}
  case "dropitem":{const keep=S.pending.items.map((ai,i)=>{const g=id=>($("#"+id+"-"+i)||{}).value;ai.book=g("f-book");ai.author=g("f-author");ai.chapter=g("f-chap");return ai});
   keep.splice(+el.dataset.i,1);S.pending.items=keep;render();break}
  case "save":save();break;
  case "open":{S.openId=el.dataset.id;S.confirmDel=false;S.editImg=null;const c0=S.chapters.find(x=>x.id===el.dataset.id);if(c0&&c0.batch&&!c0.opened)Store.patch(c0.id,{opened:Date.now()});go("chapter");break}
  case "done":Store.patch(el.dataset.id,{doneAt:Date.now()}).then(()=>{toast("Chiuso");loadWeekly();go("home")});break;
  case "deltoggle":S.confirmDel=!S.confirmDel;render();break;
  case "delete":Store.remove(el.dataset.id).then(()=>{toast("Capitolo eliminato");S.confirmDel=false;go("library")}).catch(()=>toast("Non sono riuscito a eliminare"));break;
  case "review":startReview(!!el.dataset.early);break;
  case "grade":grade();break;
  case "reveal":if(dict&&dict.active())dict.stop().catch(()=>{});S.rev.res={verdict:null,err:""};S.rev.stage="result";render();break;
  case "rate":rate(el.dataset.r);break;
  case "endrev":if(dict&&dict.active())dict.stop().catch(()=>{});S.rev=null;go("home");break;
  case "fmode":{F.mode=el.dataset.m;F.phase="work";F.total=F.presets[F.mode][0]*60;F.rem=F.total;F.running=false;render();break}
  case "ftoggle":if(F.running){F.rem=Math.max(0,Math.round((F.endAt-Date.now())/1000));F.running=false}else{F.endAt=Date.now()+F.rem*1000;F.running=true;S.banner=false}render();break;
  case "freset":F.running=false;F.rem=F.total;render();break;
  case "fskip":endPhase();break;
 }
});
document.addEventListener("input",ev=>{if(ev.target.id==="tx")S.draft=ev.target.value});
document.addEventListener("change",ev=>{const t=ev.target;
 if(t.dataset&&t.dataset.photo!==undefined)handlePhoto(t);
 else if(t.id==="imp"&&t.files[0]){importData(t.files[0]).then(()=>{t.value="";render()})}});

async function askLibrary(){
 if(dict&&dict.active())await dict.stop().catch(()=>{});
 const A=S.ask,q=(($("#tx")||{}).value||"").trim();
 if(q.length<3){setErr("Scrivi o detta una domanda.");return}
 if(!getKey()){setErr(errCopy("no_key"));return}
 if(!S.chapters.length){setErr("La libreria è vuota.");return}
 A.q=q;S.draft=q;A.busy=true;A.a="";A.err="";render();
 const lib=S.chapters.map(c=>`[${c.book}${c.author?" · "+c.author:""} · capitolo ${c.chapter} · ${fmtDay(c.createdAt)}]\nSintesi: ${c.summary||""}\nConcetti: ${(c.concepts||[]).map(x=>x.title+": "+x.text).join(" | ")}\nImmagini: ${(c.images||[]).map(x=>x.title+": "+(x.mine||x.text)).join(" | ")}\nFrasi: ${(c.phrases||[]).join(" | ")}\nDettagli: ${(c.deep||[]).map(x=>x.title+": "+x.text).join(" | ")}\nCitazioni: ${(c.quotes||[]).join(" | ")}\nDati: ${(c.data||[]).join(" | ")}`).join("\n\n").slice(0,150000);
 const prompt=`Sei l'assistente della libreria personale di Luigi. Sotto ci sono gli appunti che ha registrato dopo aver letto dei capitoli, nelle sue parole (non il testo dei libri).
Rispondi alla domanda usando SOLO questi appunti. Cita sempre libro e capitolo tra parentesi, per esempio (L'arte dell'attenzione, cap. 5). Se negli appunti non c'è la risposta, dillo chiaramente e non inventare. Se gli appunti si contraddicono, segnalalo. Rispondi in italiano, in modo diretto, in massimo 150 parole.

APPUNTI:
${lib}

DOMANDA: ${q}`;
 try{A.a=await askText(prompt,{model:MODEL_MAIN})}catch(e){A.err=errCopy(e&&e.code)}
 A.busy=false;if(S.view==="ask")render();
}
function imgToB64(file,max){max=max||1600;return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res({type:"image/jpeg",data:c.toDataURL("image/jpeg",.82).split(",")[1]})};
 im.onerror=()=>{URL.revokeObjectURL(url);rej({code:"image"})};im.src=url})}
function syncItems(){if(!S.pending)return;S.pending.items.forEach((ai,i)=>{const g=id=>($("#"+id+"-"+i)||{}).value;if(g("f-book")!==undefined){ai.book=g("f-book");ai.author=g("f-author");ai.chapter=g("f-chap")}})}
async function handlePhoto(inp){
 const file=inp.files&&inp.files[0],key=inp.dataset.photo;if(!file)return;
 if(!getKey()){toast(errCopy("no_key"));return}
 let target,chap=null;
 if(key.startsWith("c:")){chap=S.chapters.find(x=>x.id===key.slice(2));target=chap}
 else{syncItems();target=S.pending&&S.pending.items[+key]}
 if(!target)return;
 toast("Leggo la pagina…");
 try{
  const img=await imgToB64(file);
  const notes=(target.concepts||[]).map(c=>c.title+": "+c.text).join("\n");
  const prompt=`La foto mostra una pagina di un libro. Questi sono gli appunti che Luigi ha preso a voce su questo capitolo:
${notes||"(nessun appunto)"}
Rispondi SOLO con JSON: {"quotes": [fino a 3 frasi della pagina che meritano di essere citate, trascritte alla lettera], "check": [fino a 3 punti in cui gli appunti di Luigi sembrano in contrasto con il testo della pagina o ne cambiano il senso, ognuno in una frase]}
Se la pagina non è leggibile o non c'entra con gli appunti, usa liste vuote. Non inventare testo.`;
  const j=await askJSON(prompt,{model:MODEL_MAIN,image:img});
  const qs=arr(j.quotes).map(x=>String(x)+" (dalla foto)").slice(0,3),ck=arr(j.check).map(x=>"Dalla pagina: "+String(x)).slice(0,3);
  target.quotes=(target.quotes||[]).concat(qs);target.unclear=(target.unclear||[]).concat(ck);
  if(chap)await Store.patch(chap.id,{quotes:chap.quotes,unclear:chap.unclear});
  toast(qs.length+ck.length?"Pagina aggiunta":"Nessuna citazione trovata");
  render();
 }catch(e){toast(e&&e.code==="image"?"Non riesco a leggere questa foto.":errCopy(e&&e.code))}
 inp.value="";
}
async function addReminder(){
 const t=($("#rm-time")||{}).value||"21:30",hm=t.split(":"),d=new Date();d.setHours(+hm[0],+hm[1],0,0);if(d<new Date())d.setDate(d.getDate()+1);
 const p=n=>String(n).padStart(2,"0"),dt=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00";
 const url=location.origin+location.pathname+"#registra";
 const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ripeti il capitolo//IT","BEGIN:VEVENT","UID:ripeti-"+Date.now()+"@ripeti","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z","DTSTART:"+dt,"DURATION:PT10M","RRULE:FREQ=DAILY","SUMMARY:Ripeti il capitolo","DESCRIPTION:Hai letto oggi? Racconta il capitolo a voce.","URL:"+url,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Ripeti il capitolo","TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 try{const f=new File([ics],"promemoria.ics",{type:"text/calendar"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="promemoria.ics";document.body.appendChild(a);a.click();a.remove();
}
async function importData(file){
 try{const j=JSON.parse(await file.text()),list=Array.isArray(j)?j:j.chapters;
  if(!Array.isArray(list))throw 0;let n=0;
  for(const c of list){if(c&&c.id&&c.book&&!S.chapters.find(x=>x.id===c.id)){S.chapters.push(c);n++}}
  S.chapters.sort((a,b)=>b.createdAt-a.createdAt);Store._persist();toast(n?n+" capitoli importati":"Nessun capitolo nuovo");
 }catch(e){toast("Il file non sembra una copia valida.")}
}
async function exportData(){
 try{localStorage.setItem("rc_lastexp",String(Date.now()))}catch(e){}
 const data=JSON.stringify({exportedAt:new Date().toISOString(),chapters:S.chapters},null,1);
 const name="ripeti-il-capitolo-"+new Date().toISOString().slice(0,10)+".json";
 try{const f=new File([data],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function startReview(early){
 let items=dueList();
 if(!items.length&&early)items=allQ().sort((a,b)=>a.q.due-b.q.due);
 S.rev={items:items.slice(0,5),i:0,stage:"answer",res:null,counts:{ok:0,part:0,no:0}};S.draft="";S.partial="";S.micErr="";go("review");
}
/* Scorciatoie: il link con #registra apre subito la registrazione, #ripasso il ripasso */
function route(){
 const h=location.hash.replace("#","");
 let skip="";try{skip=localStorage.getItem("rc_skip")||""}catch(e){}
 if((!getKey()||!getOKey())&&!skip&&S.view==="home"){go("settings");return}
 if(h==="registra"&&S.view!=="record"){S.draft="";S.partial="";S.micErr="";go("record");const t=$("#tx");if(t)try{t.focus()}catch(e){}}
 else if(h==="ripasso"&&S.view!=="review"){if(dueList().length)startReview(false);else go("home")}
}
window.addEventListener("hashchange",route);

/* ---------- avvio ---------- */
(function(){
 Store.init();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 dict=makeDict();
 if(dict){
  dict.onFinal(({text})=>{const t=$("#tx");if(!t)return;t.value=t.value?t.value+text:text.trimStart();S.draft=t.value});
  dict.onPartial(({text})=>{S.partial=text;paintRec()});
  dict.onState(({state,reason})=>{S.listening=state==="listening";S.trans=state==="transcribing";
   if(state==="listening"&&S.view==="record"&&!S.recStartLogged){S.recStartLogged=true;logEv("rec_start",{ms:Date.now()-(S.recOpenAt||Date.now())})}
   S.micErr=(state==="idle"&&reason)?micMsg(reason):"";paintRec()});

 }
 render();route();loadWeekly();
 if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
